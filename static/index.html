<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#07080c">
  <meta name="description" content="SkinSavo — CS2 skinlar katalogi. Demo Telegram Mini App.">
  <title>SkinSavo — CS2 Skins</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand brand-skins" href="#" aria-label="SkinSavo bosh sahifa">
        <span class="brand-skin-strip" id="brandSkinStrip" aria-label="Noyob va qimmat CS2 skinlari">
          <span class="brand-skin-loading"></span>
          <span class="brand-skin-loading"></span>
          <span class="brand-skin-loading"></span>
          <span class="brand-skin-loading"></span>
        </span>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Mavzuni almashtirish" title="Light / Dark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button>
        <button class="icon-btn" id="profileBtn" aria-label="Profil"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.6 3.1-5.5 7-5.5s6.5 1.9 7 5.5"/></svg></button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow"><i></i> SKINLAR OLAMI</span>
        <h1>Inventaringni<br><span>yangila.</span></h1>
        <p>Sevimli CS2 skinlaringni top va kolleksiyangni boyit. Demo rejimda sinab ko‘r.</p>
        <button class="primary-btn" id="browseBtn">Katalogni ko‘r <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M8 17h9V8"/></svg></button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <img src="https://placehold.co/900x500/080808/ffffff?text=SKINSAVO" alt="" width="420" height="280">
      </div>
    </section>

    <section class="balance-card" aria-label="Balans">
      <div class="balance-left">
        <div class="balance-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></div>
        <div>
          <span class="muted-label">Sizning demo balansingiz</span>
          <div class="balance-value" id="balanceValue">250.00 <small>USD</small></div>
        </div>
      </div>
      <button class="topup-btn" id="topupBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> To‘ldirish</button>
    </section>

    <main id="catalog">
      <div class="section-heading">
        <div>
          <span class="eyebrow" style="margin-bottom:4px">KOLLEKSIYA</span>
          <h2>Skinlar katalogi <span class="count" id="skinCount">—</span></h2>
        </div>
        <button class="filter-btn" id="sortBtn" aria-label="Saralash"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M4 8l4-4 4 4M16 20V4m-4 12 4 4 4-4"/></svg><span id="sortLabel">Tavsiya</span></button>
      </div>

      <label class="search-box" for="searchInput">
        <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" placeholder="Skin, qurol yoki rarity qidirish..." autocomplete="off" enterkeyhint="search">
        <kbd>Ctrl K</kbd>
      </label>

      <div class="chips" id="chips" role="tablist">
        <button class="chip active" data-query="" role="tab">Barchasi</button>
        <button class="chip" data-query="AK-47" role="tab">AK-47</button>
        <button class="chip" data-query="AWP" role="tab">AWP</button>
        <button class="chip" data-query="Knife" role="tab">Pichoq</button>
        <button class="chip" data-query="Covert" role="tab">Covert</button>
        <button class="chip" data-query="Classified" role="tab">Classified</button>
        <button class="chip" data-query="Factory New" role="tab">FN</button>
      </div>

      <div class="skin-grid" id="skinGrid" aria-live="polite">
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>

      <div class="demo-note">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/></svg> Demo katalog. Narxlar va qoldiq haqiqiy bozor taklifi emas. Haqiqiy to‘lovlar va skin transferi mavjud emas.
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
      <button class="nav-item active" data-page="home" id="navHome"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Bosh sahifa</button>
      <button class="nav-item" id="inventoryBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Inventar</button>
      <button class="nav-item" id="historyBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Tarix</button>
      <button class="nav-item" id="accountBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.6 3.1-5.5 7-5.5s6.5 1.9 7 5.5"/></svg>Profil</button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Yopish">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <template id="adminPanelTemplate">
    <span class="eyebrow">ADMINISTRATOR</span>
    <h2 id="modalTitle">Yangi skin joylash</h2>
    <p>Skin rasmi uchun to‘g‘ridan-to‘g‘ri ishlaydigan HTTPS rasm havolasini kiriting.</p>
    <form id="adminSkinForm">
      <label class="field-label" for="adminName">Skin nomi</label><input class="modal-input" id="adminName" name="name" required placeholder="AWP | Dragon Lore">
      <label class="field-label" for="adminWeapon">Qurol</label><input class="modal-input" id="adminWeapon" name="weapon" required placeholder="AWP">
      <label class="field-label" for="adminSkin">Skin nomi</label><input class="modal-input" id="adminSkin" name="skin" required placeholder="Dragon Lore">
      <label class="field-label" for="adminRarity">Rarity</label><input class="modal-input" id="adminRarity" name="rarity" required placeholder="Covert">
      <label class="field-label" for="adminCondition">Holati</label><input class="modal-input" id="adminCondition" name="condition" required placeholder="Factory New">
      <label class="field-label" for="adminPrice">Narxi (USD)</label><input class="modal-input" id="adminPrice" name="price" type="number" min="0" step="0.01" required>
      <label class="field-label" for="adminStock">Soni</label><input class="modal-input" id="adminStock" name="stock" type="number" min="0" step="1" required value="1">
      <label class="field-label" for="adminImage">Rasm URL</label><input class="modal-input" id="adminImage" name="image" type="url" required placeholder="https://...">
      <label class="field-label" for="adminDescription">Tavsif</label><textarea class="modal-input" id="adminDescription" name="description" rows="3" placeholder="Skin haqida qisqacha"></textarea>
      <button class="full-btn" type="submit" id="adminSaveSkin">Skinni joylash</button>
    </form>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
